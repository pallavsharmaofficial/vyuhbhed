name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Infos and warnings fail the build too: the deprecation backlog this
        # project started with is exactly what --fatal-infos prevents.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: release signing needs android/key.properties, which is not
      # in the repo. arm64 only, for the reason in docs/RELEASE.md.
      - run: flutter build apk --debug --target-platform android-arm64

      - name: Verify the APK can launch
        # Catches a MainActivity whose package no longer matches the manifest —
        # the bug that shipped in v0.2.0 and crashed on every device.
        run: ./tool/verify-apk.sh build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
