name: Deploy web preview

# Publishes the web preview to GitHub Pages, free, on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# Nothing else. No account beyond GitHub, no card, no bill.
#
# The site lands at https://<user>.github.io/<repo>/ — which is why base-href
# is set below. Without it every asset 404s and you get a white screen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web app
        # The Flutter app is served from /<repo>/app/, so the landing page can
        # own the root. Without the right base-href every asset 404s.
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/app/" \
            --no-wasm-dry-run \
            ${{ vars.SAATH_MODEL_BASE_URL && format('--dart-define=SAATH_MODEL_BASE_URL={0}', vars.SAATH_MODEL_BASE_URL) || '' }} \
            ${{ vars.SAATH_MODEL_IDS && format('--dart-define=SAATH_MODEL_IDS={0}', vars.SAATH_MODEL_IDS) || '' }} \
            ${{ vars.SAATH_SUPPORT_URL && format('--dart-define=SAATH_SUPPORT_URL={0}', vars.SAATH_SUPPORT_URL) || '' }}

      - name: Assemble the site
        # site/  -> /            the landing page a stranger sees first
        # app/   -> /app/        the Flutter build
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/app
          cp -R build/web/. _site/app/
          # GitHub Pages has no rewrite rules, so a deep link like /app/practice
          # would 404. Handing it index.html gives the route back to go_router.
          cp build/web/index.html _site/404.html
          cp build/web/index.html _site/app/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
