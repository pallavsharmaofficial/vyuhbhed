<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Vyuhbhed</title>
  <meta name="description" content="Vyuhbhed — run your notice period like a campaign. Daily plan, scored mock interviews, resume review, one-tap job search. On your phone, English and Hindi.">
  <meta name="keywords" content="job search, interview practice, mock interview, resume review, notice period, India, Hindi, offline, free">

  <!-- Shown when the link is pasted into WhatsApp, Instagram, Reddit or X.
       Almost every visitor will arrive through one of those, so the card is
       the first thing they see, not the app. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vyuhbhed — your notice period, run like a campaign">
  <meta property="og:description" content="One plan every morning, mock interviews that score you, a resume that gets read, and a coach for the bad afternoons. Runs on your phone. Free, and offline by default.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="en_IN">
  <meta property="og:locale:alternate" content="hi_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Vyuhbhed — your notice period, run like a campaign">
  <meta name="twitter:description" content="A job-hunt coach that runs on your phone. Daily plan, scored mock interviews, resume review. Free, offline, English and Hindi.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="theme-color" content="#171320">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vyuhbhed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The ground colour from the app's palette, so the first paint is Vyuhbhed
       rather than a white flash. Both themes, because the app follows the
       system and a white flash into a dark app is jarring. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F7F5F9;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #171320; }
    }

    /* Shown until Flutter paints. Deliberately plain: a spinner over a slow
       Indian connection reads as broken, a sentence reads as loading. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #5B5468;
      text-align: center;
      padding: 24px;
    }
    #boot b { font-size: 20px; font-weight: 700; color: #221D2B; letter-spacing: -0.3px; }
    #boot span { font-size: 14px; max-width: 30ch; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      #boot { color: #B3A9C0; }
      #boot b { color: #F1ECF5; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <b>Vyuhbhed</b>
    <span>Loading. This is a preview — the real counsellor runs on your phone.</span>
    <noscript>
      <span>Vyuhbhed needs JavaScript. Turn it on, or get the Android app.</span>
    </noscript>
  </div>

  <script>
    // Remove the boot message once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
